[project]
name = "prosperity"
version = "0.1.0"
description = "Quantitative trading research and strategy development for IMC Prosperity, including backtesting and simulation infrastructure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hurst>=0.0.5",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "jsonpickle>=4.1.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "plotly>=6.7.0",
    "polars>=1.39.2",
    "prosperity4btest",
    "scipy-stubs>=1.17.1.4",
    "statsmodels>=0.14.6",
]

[project.scripts]
gen-trader = "src.scripts.generate_trader_file:main"
bt = "prosperity4bt.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
prosperity4btest = { path = "../imc-prosperity-4-backtester", editable = true }

[tool.mypy]
explicit_package_bases = true
exclude = "src/traders/history/*"

[[tool.mypy.overrides]]
module = [
    "statsmodels.*",
    "hurst",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "ruff>=0.15.11",
]
