[project]
name = "prosperity"
version = "0.1.0"
description = "Quantitative trading research and strategy development for IMC Prosperity, including backtesting and simulation infrastructure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "polars>=1.39.2",
    "prosperity3bt",
]

[project.scripts]
gen-trader = "src.scripts.generate_trader_file:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
prosperity3bt = { path = "../imc-prosperity-3-backtester" }
